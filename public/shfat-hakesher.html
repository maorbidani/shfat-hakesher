pen a conversation beyond this.",l:["The thing that surprised me most was\u2026","One thing I learned about our relationship language\u2026"],s:180},{t:"The Key Sentence",w:"B",x:"Say it together:",l:["Today we didn\u2019t fix anything \u2013 but we started to see. And from here, we can build."],s:0}]}]},{t:"Speech Patterns That Create Distance",s:"Recognize, pause, and stop hurting without meaning to",ic:"\u{1F300}",L:{idea:"In a relationship we don\u2019t respond to what was said \u2013 but to what it triggers in us.",cards:[{h:"1. The Blame Pattern",g:"\u201CYou always / you never\u201D",p:["Generalizing and criticizing","Putting responsibility on the other","What\u2019s really happening: a need to be seen and heard, disguised as criticism"]},{h:"2. The Defense Pattern",g:"\u201CThat\u2019s not true / you\u2019re exaggerating / it\u2019s your fault\u201D",p:["Justifying and explaining","Dismissing the other\u2019s experience","What\u2019s really happening: fear of blame that blocks listening"]},{h:"3. The Withdrawal Pattern",g:"Silence, distance, shutting down",p:["Avoiding the conversation, \u201CI have no energy\u201D","Emotional freezing","What\u2019s really happening: protecting myself \u2013 at the cost of the relationship"]},{h:"4. The Escalation Pattern",g:"Raised voices, sarcasm, explosions",p:["Extreme reactions and sharp tones","Losing boundaries in speech","What\u2019s really happening: pain that wasn\u2019t given room \u2013 and comes out with force"]}],flow:{h:"The couple\u2019s cycle \u2013 one pattern triggers another",st:["Blame","Defense","Escalation","Withdrawal"],loop:1},note:"Once a pattern is recognized, it stops being \u201Cus\u201D. A relationship doesn\u2019t need perfect people \u2013 it needs people who recognize what drives them."},tool:"match",P:[{n:"Recognize the Pattern \u2013 Without Blaming",rules:["Speak about my pattern \u2013 not my partner\u2019s","No examples and no stories","Not \u201Cyou start it\u201D \u2013 but \u201Cthis is our cycle\u201D"],pre:[{t:"Personal Choice",w:"B",x:"Each of you quietly picks one pattern you recognize in yourself \u2013 not in your partner: blame, defense, withdrawal or escalation.",l:[],s:60}],round:[{t:"Protected Sharing",w:"S",x:"Say one sentence, filling in the blanks:",l:["When I feel ______, the pattern that tends to come out of me is ______."],s:60},{t:"Listening and Reflecting",w:"L",x:"Answer with just one phrase \u2013 and that\u2019s all:",l:["I heard you."],s:0}],swap:1,closing:[{t:"Shared Recognition",w:"B",x:"Complete together:",l:["The cycle we recognize between us is ______."],s:120}]}]},{t:"Responsible Communication",s:"Speaking myself without hurting the relationship",ic:"\u{1F5E3}\uFE0F",L:{idea:"My feeling is real \u2013 but the responsibility for how I express it is mine.",flow:{h:"The Relationship Language Formula",st:["Fact","Feeling","Meaning","Request"]},cards:[{h:"1. Owning the feeling",g:"",p:["Not: \u201CYou make me feel\u2026\u201D","Yes: \u201CWhen ____ happens, I feel ____.\u201D"]},{h:"2. Separating feeling from request",g:"",p:["A feeling is mine.","A request is an invitation \u2013 not a demand."]},{h:"3. Tone before content",g:"",p:["The same sentence, in a different tone, creates a different reality."]}],note:"Not every truth must be said right away, but every truth should be said well. This isn\u2019t a technical formula \u2013 it\u2019s a mature language."},tool:"build3",P:[{n:"Talk Feelings \u2013 Without Blaming",rules:["Choose a small, everyday topic \u2013 not a big conflict","The speaker follows the formula, no deviations","The listener: no solutions and no explanations"],round:[{t:"The Speaker \u2013 By the Formula",w:"S",x:"Pick a small everyday topic and share through the four steps:",l:["Fact: When ____ happened","Feeling: I felt ____","Meaning: It made me feel ____","Request: I\u2019m asking ____"],s:180},{t:"The Listener \u2013 A Relationship-Language Response",w:"L",x:"Answer only:",l:["I heard you. It makes sense that you feel this way."],s:0}],swap:1,closing:[{t:"Closing Sentence",w:"B",x:"",l:["Responsible communication isn\u2019t giving up on myself \u2013 it\u2019s a way to protect both me and the relationship."],s:0}]},{n:"Advanced Practice \u2013 Staying Connected When It\u2019s Hard",rules:["Choose a calm time \u2013 not during a fight","Agree in advance on 15\u201320 minutes","Agree to stop if either of you gets overwhelmed","This isn\u2019t for solving problems \u2013 it\u2019s for protecting the connection"],pre:[{t:"Naming Your Emotional State (Personal)",w:"B",x:"Each of you answers silently, for yourself. Don\u2019t share yet.",l:["The main feeling I\u2019m carrying right now is\u2026","What triggers me most about it is\u2026"],s:60}],round:[{t:"The Speaker \u2013 Advanced Sharing",w:"S",x:"Speak using the structure. No requests for change at this stage.",l:["Right now there\u2019s a feeling of ____ in me.","It shows up mostly when ____.","What matters most to me is that you listen to ____.","I\u2019m not asking for a solution right now \u2013 only presence."],s:240},{t:"The Listener \u2013 Active Presence",w:"L",x:"Three parts, no more than that:",l:["Reflecting: I hear that there\u2019s ____ in you.","Validating: It makes sense that you feel this way.","Presence: I\u2019m here with you."],s:60},{t:"Shared Regulation",w:"B",x:"Sit in silence together. Breathe. Share the same space. This is a critical step \u2013 the brain learns that a relationship can hold emotion.",l:[],s:120}],swap:1,closing:[{t:"A Mature Closing",w:"B",x:"Each of you completes. Don\u2019t open a new topic.",l:["What helped me stay connected was\u2026","One thing I learned about myself while speaking\u2026"],s:120},{t:"Closing Sentence",w:"B",x:"",l:["A strong relationship isn\u2019t one without hard feelings \u2013 it\u2019s one that knows how to hold them together."],s:0}]}]},{t:"Constructive Conflict",s:"How to argue well in the language of connection",ic:"\u{1F54A}\uFE0F",L:{idea:"A relationship doesn\u2019t avoid conflict \u2013 a relationship holds conflict.",flow:{h:"The Conflict Structure",st:["Facts","Feeling","Need","Responsible request"]},cards:[{h:"1. Self-responsibility, always",g:"",p:["I\u2019m responsible for what comes out of my mouth","My speech is not a weapon"]},{h:"2. Active listening",g:"",p:["Hear the need and feeling behind the words","Don\u2019t explain, fix, or answer right away"]},{h:"3. Framing before a hard talk",g:"",p:["\u201CI want to talk about something important. I\u2019m not here to win but to understand and be understood.\u201D"]},{h:"Avoid\u2026",g:"",p:["Blame \u2013 triggers defense, not solutions","Dragging up the past \u2013 misses the present","Sarcasm and cynicism \u2013 damage security","Prolonged silence \u2013 creates disconnection"]}],note:"Conflict doesn\u2019t have to mean loss \u2013 it can be an opportunity for understanding, closeness and building."},tool:"build4",P:[{n:"Controlled Conflict",rules:["A sensitive but small topic: sharing chores, quality time, technology","One fact only \u2013 neutral, no interpretation","No dredging up the past, no sarcasm","No further arguing at the end of the exercise"],pre:[{t:"Framing",w:"B",x:"Pick a small topic, and say to each other:",l:["I want to talk about something important. I\u2019m not here to win but to understand and be understood."],s:0}],round:[{t:"Step 1 \u2013 Fact",w:"S",x:"One fact only, neutral.",l:["For example: Yesterday I didn\u2019t get a message from you for two hours."],s:60},{t:"Step 2 \u2013 Feeling",w:"S",x:"The real feeling the fact brought up.",l:["For example: It made me feel alone."],s:60},{t:"Step 3 \u2013 Need",w:"S",x:"What need sits behind the feeling?",l:["For example: I need to feel connected even when I\u2019m busy."],s:60},{t:"Step 4 \u2013 Responsible Request",w:"S",x:"Ask for a clear action, without demanding.",l:["For example: Can we check in with each other when we\u2019re busy?"],s:60}],swap:1,closing:[{t:"Summary",w:"B",x:"Each of you completes. No further arguing.",l:["What I learned about myself\u2026","What I learned about you\u2026"],s:120}]}]},{t:"Closeness Talk",s:"Building intimacy through mindful communication",ic:"\u{1F49E}",L:{idea:"Intimacy isn\u2019t created by love alone \u2013 it\u2019s built through speech that connects and draws us closer.",cards:[{h:"1. Everyday talk",g:"Short conversations about the day",p:["\u201CI was really stressed today, but talking with you calmed me down.\u201D"]},{h:"2. Appreciation talk",g:"Don\u2019t wait for a big occasion",p:["\u201CI appreciate that you made time for me today.\u201D"]},{h:"3. Deep talk",g:"Feelings, dreams, fears \u2013 in responsible language",p:["\u201CWhen you listen, I feel safe sharing my thoughts.\u201D"]},{h:"Tools for closeness",g:"",p:["I feel \u2013 I need \u2013 I ask","Questions that bring us closer","Verbal gestures: \u201CThank you for\u2026\u201D","A weekly couple\u2019s check-in, 5\u201310 minutes"]}],note:"Closeness talk is the glue of a relationship. The stronger it is, the better the bond holds even in a crisis."},tool:"cards",P:[{n:"Everyday Closeness Talk",rules:["A fixed time: 10\u201315 minutes a day, no distractions","We don\u2019t solve problems in this exercise","The listener answers only with listening phrases"],pre:[{t:"A Fixed Time",w:"B",x:"Put your phones aside. Sit close.",l:[],s:0}],round:[{t:"Three Good Things",w:"S",x:"Three positive things from today \u2013 one of them must be about your partner.",l:["For example: I\u2019m glad you made the coffee this morning \u2013 it helped me start the day calm."],s:180},{t:"One Meaningful Feeling",w:"S",x:"One feeling from today, using the formula: fact \u2192 feeling \u2192 meaning \u2192 request.",l:[],s:120},{t:"Active Listening",w:"L",x:"Answer with just one of these:",l:["I hear you","I understand","I\u2019m here with you"],s:0}],swap:1,closing:[{t:"A Positive Gesture",w:"B",x:"Each of you says to the other:",l:["I appreciate you","I\u2019m glad we\u2019re together"],s:0}]}]},{t:"The Intimate Space \u2013 Love, Passion & Desire",s:"Premium step \xB7 100 cards of intimacy, questions & challenges",ic:"\u{1F525}",tool:"prem",P:[]}],V0={rules:["\u05E9\u05D0\u05DC\u05D4 \u05DE\u05D4\u05DC\u05D1 \u05D0\u05D5 \u05D4\u05E6\u05E2\u05D4 \u05DC\u05E7\u05E8\u05D1\u05D4 \u2013 \u05E9\u05D5\u05DC\u05E4\u05D9\u05DD \u05E7\u05DC\u05E3 \u05D5\u05DE\u05E9\u05EA\u05E4\u05D9\u05DD \u05DE\u05EA\u05D5\u05DA \u05E1\u05E7\u05E8\u05E0\u05D5\u05EA \u05D0\u05DE\u05D9\u05EA\u05D9\u05EA.","\u05EA\u05E9\u05D5\u05D1\u05D4 \u05DB\u05E0\u05D4 \u05D5\u05D0\u05DE\u05D9\u05EA\u05D9\u05EA \u05DC\u05D7\u05DC\u05D5\u05D8\u05D9\u05DF \u2013 \u05D1\u05DC\u05D9 \u05DC\u05D9\u05D9\u05E4\u05D5\u05EA \u05D5\u05D1\u05DC\u05D9 \u05DC\u05DE\u05D4\u05E8.","\u05D4\u05E7\u05E9\u05D1\u05D4 \u05D1\u05E0\u05D5\u05DB\u05D7\u05D5\u05EA \u05DE\u05DC\u05D0\u05D4 \u2013 \u05D1\u05DC\u05D9 \u05E9\u05D9\u05E4\u05D5\u05D8, \u05D1\u05DC\u05D9 \u05EA\u05D9\u05E7\u05D5\u05DF, \u05D1\u05DC\u05D9 \u201C\u05D0\u05D1\u05DC\u201D.","\u05E1\u05D3\u05E8\u05EA 100 \u05D4\u05E7\u05DC\u05E4\u05D9\u05DD \u05DE\u05E2\u05D5\u05E8\u05D1\u05D1\u05EA \u05DC\u05DC\u05D0 \u05DB\u05E4\u05D9\u05DC\u05D5\u05D9\u05D5\u05EA \u2013 \u05D4\u05E1\u05DB\u05DE\u05D4, \u05E8\u05D5\u05DA \u05D5\u05E0\u05D5\u05D7\u05D5\u05EA \u05D4\u05D3\u05D3\u05D9\u05EA \u05E7\u05D5\u05D3\u05DE\u05D5\u05EA \u05DC\u05DB\u05D5\u05DC."],q:["\u05DE\u05D4 \u05D4\u05D3\u05D1\u05E8 \u05D1\u05D9 \u05E9\u05D4\u05DB\u05D9 \u05DE\u05D5\u05E9\u05DA \u05D0\u05D5\u05EA\u05DA \u05D5\u05D2\u05D5\u05E8\u05DD \u05DC\u05DA \u05DC\u05E8\u05E6\u05D5\u05EA \u05DC\u05D4\u05EA\u05E7\u05E8\u05D1 \u05D0\u05DC\u05D9\u05D9?","\u05D0\u05D9\u05D6\u05D4 \u05E8\u05D2\u05E2 \u05D0\u05D9\u05E0\u05D8\u05D9\u05DE\u05D9 \u05E9\u05DC\u05E0\u05D5 \u05DE\u05E2\u05DC\u05D4 \u05D1\u05DA \u05D7\u05D5\u05DD \u05D5\u05D7\u05E9\u05E7 \u05D1\u05DB\u05DC \u05E4\u05E2\u05DD \u05E9\u05D0\u05EA/\u05D4 \u05E0\u05D6\u05DB\u05E8/\u05EA \u05D1\u05D5?","\u05DE\u05D4 \u05D4\u05D9\u05D9\u05EA \u05E8\u05D5\u05E6\u05D4 \u05E9\u05E0\u05E2\u05E9\u05D4 \u05D9\u05D7\u05D3 \u05D4\u05DC\u05D9\u05DC\u05D4 \u05E9\u05E2\u05D5\u05D3 \u05DC\u05D0 \u05D4\u05E2\u05D6\u05EA \u05DC\u05D1\u05E7\u05E9?","\u05DE\u05D4 \u05DE\u05D3\u05DC\u05D9\u05E7 \u05D0\u05E6\u05DC\u05DA \u05D0\u05EA \u05D4\u05D9\u05E6\u05E8 \u05D5\u05D4\u05E1\u05E7\u05E8\u05E0\u05D5\u05EA \u05D1\u05E7\u05E9\u05E8 \u05E9\u05DC\u05E0\u05D5?","\u05D1\u05D0\u05D9\u05D6\u05D4 \u05E1\u05D5\u05D2 \u05E9\u05DC \u05DE\u05D2\u05E2 \u05D0\u05EA\u05D4/\u05D0\u05EA \u05D4\u05DB\u05D9 \u05E0\u05DE\u05E1/\u05D4?","\u05D0\u05D9\u05DA \u05D4\u05DB\u05D9 \u05E0\u05E2\u05D9\u05DD \u05DC\u05DA \u05E9\u05D0\u05E4\u05EA\u05D7 \u05E2\u05E8\u05D1 \u05E8\u05D5\u05DE\u05E0\u05D8\u05D9 \u2013 \u05D1\u05DE\u05D9\u05DC\u05D9\u05DD, \u05D1\u05DE\u05D1\u05D8 \u05D0\u05D5 \u05D1\u05DE\u05D2\u05E2?","\u05DE\u05EA\u05D9 \u05D1\u05E4\u05E2\u05DD \u05D4\u05D0\u05D7\u05E8\u05D5\u05E0\u05D4 \u05D4\u05E1\u05EA\u05DB\u05DC\u05EA \u05E2\u05DC\u05D9\u05D9 \u05D5\u05D4\u05E8\u05D2\u05E9\u05EA \u05DE\u05E9\u05D9\u05DB\u05D4 \u05DE\u05D7\u05D5\u05D3\u05E9\u05EA? \u05DE\u05D4 \u05E8\u05D0\u05D9\u05EA?","\u05D0\u05D9\u05D6\u05D5 \u05DE\u05D9\u05DC\u05D4 \u05D0\u05D5 \u05DE\u05E9\u05E4\u05D8 \u05E9\u05DC\u05D9 \u05D2\u05D5\u05E8\u05DE\u05D9\u05DD \u05DC\u05DA \u05DC\u05D4\u05E8\u05D2\u05D9\u05E9 \u05E8\u05E6\u05D5\u05D9/\u05D4?","\u05D0\u05D9\u05E4\u05D4 \u05D0\u05EA\u05D4/\u05D0\u05EA \u05D4\u05DB\u05D9 \u05D0\u05D5\u05D4\u05D1/\u05EA \u05E9\u05D0\u05D2\u05E2 \u05D1\u05DA, \u05D5\u05D0\u05D9\u05D6\u05D4 \u05E7\u05E6\u05D1 \u05E0\u05E2\u05D9\u05DD \u05DC\u05DA?","\u05D0\u05D9\u05D6\u05D5 \u05E4\u05E0\u05D8\u05D6\u05D9\u05D4 \u05E8\u05D5\u05DE\u05E0\u05D8\u05D9\u05EA \u05E7\u05D8\u05E0\u05D4 \u2013 \u05DE\u05E7\u05D5\u05DD, \u05D0\u05D5\u05D5\u05D9\u05E8\u05D4, \u05E8\u05D9\u05D7 \u2013 \u05D4\u05D9\u05D9\u05EA \u05E8\u05D5\u05E6\u05D4 \u05E9\u05E0\u05D9\u05E6\u05D5\u05E8 \u05D9\u05D7\u05D3?","\u05DE\u05D4 \u05D2\u05D5\u05E8\u05DD \u05DC\u05DA \u05DC\u05D4\u05E8\u05D2\u05D9\u05E9 \u05D1\u05D8\u05D5\u05D7/\u05D4 \u05DE\u05E1\u05E4\u05D9\u05E7 \u05DB\u05D3\u05D9 \u05DC\u05D4\u05EA\u05DE\u05E1\u05E8 \u05DC\u05D2\u05DE\u05E8\u05D9?","\u05D0\u05D9\u05D6\u05D4 \u05D6\u05D9\u05DB\u05E8\u05D5\u05DF \u05DE\u05D4\u05EA\u05E7\u05D5\u05E4\u05D4 \u05D4\u05E8\u05D0\u05E9\u05D5\u05E0\u05D4 \u05E9\u05DC\u05E0\u05D5 \u05E2\u05D3\u05D9\u05D9\u05DF \u05DE\u05D3\u05DC\u05D9\u05E7 \u05D0\u05D5\u05EA\u05DA?","\u05D0\u05D9\u05DA \u05D0\u05E4\u05E9\u05E8 \u05DC\u05D4\u05E6\u05D9\u05EA \u05DE\u05D7\u05D3\u05E9 \u05D0\u05EA \u05D4\u05E0\u05D9\u05E6\u05D5\u05E5 \u05D1\u05D0\u05DE\u05E6\u05E2 \u05E9\u05D1\u05D5\u05E2 \u05E2\u05DE\u05D5\u05E1?","\u05DE\u05D4 \u05D4\u05D9\u05D9\u05EA \u05E8\u05D5\u05E6\u05D4 \u05E9\u05D0\u05E2\u05E9\u05D4 \u05D9\u05D5\u05EA\u05E8 \u2013 \u05DE\u05E9\u05D4\u05D5 \u05E9\u05D0\u05D5\u05DC\u05D9 \u05D0\u05E0\u05D9 \u05DC\u05D0 \u05D9\u05D5\u05D3\u05E2/\u05EA \u05E9\u05D0\u05EA\u05D4/\u05D0\u05EA \u05DE\u05D7\u05DB\u05D4 \u05DC\u05D5?","\u05D0\u05D9\u05D6\u05D4 \u05DC\u05D1\u05D5\u05E9 \u05D0\u05D5 \u05DE\u05E8\u05D0\u05D4 \u05E9\u05DC\u05D9 \u05D2\u05D5\u05E8\u05DD \u05DC\u05DA \u05DC\u05D4\u05E1\u05EA\u05DB\u05DC \u05E4\u05E2\u05DE\u05D9\u05D9\u05DD?","\u05DB\u05E9\u05D0\u05E0\u05D7\u05E0\u05D5 \u05DE\u05EA\u05E7\u05E8\u05D1\u05D9\u05DD \u2013 \u05DE\u05D4 \u05D9\u05D5\u05E6\u05E8 \u05D0\u05E6\u05DC\u05DA \u05D0\u05EA \u05EA\u05D7\u05D5\u05E9\u05EA \u05D4\u05D7\u05D9\u05D1\u05D5\u05E8 \u05D4\u05E2\u05DE\u05D5\u05E7\u05D4 \u05D1\u05D9\u05D5\u05EA\u05E8?","\u05DE\u05D4\u05D5 \u05D4\u05D3\u05D1\u05E8 \u05D4\u05DB\u05D9 \u05DE\u05E8\u05D2\u05E9 \u05E9\u05D7\u05D5\u05D5\u05D9\u05EA \u05D0\u05D9\u05EA\u05D9, \u05D1\u05D2\u05D5\u05E3 \u05D5\u05D1\u05E0\u05E9\u05DE\u05D4 \u05D9\u05D7\u05D3?","\u05DE\u05D4 \u05D4\u05E8\u05E6\u05D5\u05DF \u05E9\u05DC\u05DA \u05DC\u05DC\u05D9\u05DC\u05D4 \u05D4\u05D1\u05D0 \u05E9\u05DC\u05E0\u05D5, \u05D1\u05DE\u05E9\u05E4\u05D8 \u05D0\u05D7\u05D3 \u05DB\u05E0\u05D4?","\u05DE\u05D4\u05D5 \u05D4\u05DE\u05E7\u05D5\u05DD \u05D4\u05DB\u05D9 \u05DE\u05E4\u05EA\u05D9\u05E2 \u05D1\u05D2\u05D5\u05E3 \u05E9\u05DC\u05D9 \u05E9\u05D0\u05EA\u05D4/\u05D0\u05EA \u05D0\u05D5\u05D4\u05D1/\u05EA \u05DC\u05D4\u05E1\u05EA\u05DB\u05DC \u05E2\u05DC\u05D9\u05D5?","\u05D0\u05D9\u05D6\u05D5 \u05DE\u05D7\u05DE\u05D0\u05D4 \u05E9\u05E7\u05D9\u05D1\u05DC\u05EA \u05DE\u05DE\u05E0\u05D9 \u05E2\u05D3\u05D9\u05D9\u05DF \u05DE\u05D7\u05DE\u05DE\u05EA \u05D0\u05D5\u05EA\u05DA?","\u05DE\u05D4 \u05D4\u05D9\u05D9\u05EA \u05E8\u05D5\u05E6\u05D4 \u05E9\u05D0\u05DC\u05D7\u05E9 \u05DC\u05DA \u05D1\u05D0\u05D5\u05D6\u05DF?","\u05D0\u05D9\u05D6\u05D4 \u05E8\u05D9\u05D7 \u05E9\u05DC\u05D9 \u05D2\u05D5\u05E8\u05DD \u05DC\u05DA \u05DC\u05E8\u05E6\u05D5\u05EA \u05DC\u05D4\u05EA\u05E7\u05E8\u05D1?","\u05D0\u05D9\u05DA \u05E0\u05E8\u05D0\u05D4 \u05D4\u05E2\u05E8\u05D1 \u05D4\u05DE\u05D5\u05E9\u05DC\u05DD \u05E9\u05DC\u05E0\u05D5 \u2013 \u05DB\u05D6\u05D4 \u05E9\u05DE\u05EA\u05D7\u05D9\u05DC \u05D1\u05E0\u05E9\u05D9\u05E7\u05D4?","\u05DE\u05EA\u05D9 \u05D4\u05E8\u05D2\u05E9\u05EA \u05D4\u05DB\u05D9 \u05E0\u05D7\u05E9\u05E7/\u05EA \u05D0\u05D9\u05EA\u05D9?","\u05D0\u05D9\u05D6\u05D4 \u05E9\u05D9\u05E8 \u05D2\u05D5\u05E8\u05DD \u05DC\u05DA \u05DC\u05D7\u05E9\u05D5\u05D1 \u05E2\u05DC\u05D9\u05D9 \u05D1\u05E6\u05D5\u05E8\u05D4 \u05D7\u05D5\u05E9\u05E0\u05D9\u05EA?","\u05DE\u05D4\u05D9 \u05D4\u05E0\u05E9\u05D9\u05E7\u05D4 \u05D4\u05DB\u05D9 \u05D1\u05DC\u05EA\u05D9 \u05E0\u05E9\u05DB\u05D7\u05EA \u05E9\u05DC\u05E0\u05D5, \u05D5\u05DC\u05DE\u05D4?","\u05D0\u05D9\u05D6\u05D5 \u05DE\u05D9\u05DC\u05D4 \u05D0\u05D7\u05EA \u05DE\u05EA\u05D0\u05E8\u05EA \u05D0\u05D9\u05DA \u05D0\u05EA\u05D4/\u05D0\u05EA \u05DE\u05E8\u05D2\u05D9\u05E9/\u05D4 \u05DB\u05E9\u05D0\u05E0\u05D9 \u05DE\u05D7\u05D1\u05E7/\u05EA \u05D0\u05D5\u05EA\u05DA \u05D7\u05D6\u05E7?","\u05DE\u05D4 \u05D4\u05DB\u05D9 \u05DE\u05E8\u05D2\u05E9 \u05D0\u05D5\u05EA\u05DA \u05DB\u05E9\u05D0\u05E0\u05D9 \u05DC\u05D5\u05E7\u05D7/\u05EA \u05D9\u05D5\u05D6\u05DE\u05D4?","\u05D5\u05DE\u05D4 \u05D4\u05DB\u05D9 \u05DE\u05E8\u05D2\u05E9 \u05D0\u05D5\u05EA\u05DA \u05DB\u05E9\u05D0\u05EA\u05D4/\u05D0\u05EA \u05DC\u05D5\u05E7\u05D7/\u05EA \u05D9\u05D5\u05D6\u05DE\u05D4?","\u05D0\u05D9\u05D6\u05D4 \u05DE\u05E7\u05D5\u05DD, \u05D1\u05D1\u05D9\u05EA \u05D0\u05D5 \u05DE\u05D7\u05D5\u05E6\u05D4 \u05DC\u05D5, \u05DE\u05E2\u05D5\u05E8\u05E8 \u05D1\u05DA \u05D0\u05D5\u05D5\u05D9\u05E8\u05D4 \u05E8\u05D5\u05DE\u05E0\u05D8\u05D9\u05EA?","\u05DE\u05D4 \u05D4\u05D9\u05D9\u05EA \u05E8\u05D5\u05E6\u05D4 \u05E9\u05D0\u05E2\u05E9\u05D4 \u05DC\u05E4\u05E0\u05D9 \u05E9\u05E0\u05E8\u05D3\u05DE\u05D9\u05DD \u05D4\u05DC\u05D9\u05DC\u05D4?","\u05D0\u05D9\u05D6\u05D4 \u05DE\u05D2\u05E2 \u05E7\u05D8\u05DF \u05D1\u05D9\u05D5\u05DD-\u05D9\u05D5\u05DD \u05D2\u05D5\u05E8\u05DD \u05DC\u05DA \u05DC\u05D4\u05E8\u05D2\u05D9\u05E9 \u05D0\u05D4\u05D5\u05D1/\u05D4?","\u05D0\u05D9\u05D6\u05D5 \u05D4\u05E4\u05EA\u05E2\u05D4 \u05E8\u05D5\u05DE\u05E0\u05D8\u05D9\u05EA \u05D4\u05D9\u05D9\u05EA \u05E8\u05D5\u05E6\u05D4 \u05DC\u05E7\u05D1\u05DC \u05DE\u05DE\u05E0\u05D9?","\u05DE\u05EA\u05D9 \u05D0\u05EA\u05D4/\u05D0\u05EA \u05DE\u05E8\u05D2\u05D9\u05E9/\u05D4 \u05D4\u05DB\u05D9 \u05D9\u05E4\u05D4 \u05D0\u05D5 \u05E0\u05D0\u05D4 \u05D1\u05E2\u05D9\u05E0\u05D9\u05D9?","\u05DE\u05D4 \u05D4\u05D9\u05D9\u05EA \u05E8\u05D5\u05E6\u05D4 \u05DC\u05D7\u05D3\u05E9 \u05D1\u05D0\u05D5\u05D5\u05D9\u05E8\u05D4 \u05D1\u05D7\u05D3\u05E8 \u05E9\u05DC\u05E0\u05D5 \u2013 \u05EA\u05D0\u05D5\u05E8\u05D4, \u05DE\u05D5\u05D6\u05D9\u05E7\u05D4, \u05E8\u05D9\u05D7?","\u05D0\u05D9\u05D6\u05D4 \u05E8\u05D2\u05E2 \u05E9\u05DC \u05E9\u05E7\u05D8 \u05D5\u05E7\u05E8\u05D1\u05D4 \u05D1\u05D9\u05E0\u05D9\u05E0\u05D5 \u05D0\u05EA\u05D4/\u05D0\u05EA \u05D4\u05DB\u05D9 \u05D0\u05D5\u05D4\u05D1/\u05EA?","\u05DE\u05D4 \u05D0\u05E0\u05D9 \u05E2\u05D5\u05E9\u05D4 \u05D1\u05DC\u05D9 \u05DC\u05E9\u05D9\u05DD \u05DC\u05D1 \u05E9\u05DE\u05D3\u05DC\u05D9\u05E7 \u05D0\u05D5\u05EA\u05DA?","\u05D0\u05D9\u05DA \u05D4\u05DB\u05D9 \u05D8\u05D5\u05D1 \u05DC\u05DA \u05DC\u05D4\u05EA\u05E2\u05D5\u05E8\u05E8 \u05DC\u05D9\u05D3\u05D9?","\u05D0\u05D9\u05D6\u05D4 \u05DE\u05D1\u05D8 \u05D1\u05D9\u05E0\u05D9\u05E0\u05D5 \u05E2\u05D3\u05D9\u05D9\u05DF \u05E2\u05D5\u05E9\u05D4 \u05DC\u05DA \u05E4\u05E8\u05E4\u05E8\u05D9\u05DD?","\u05DE\u05D4 \u05D4\u05D3\u05D1\u05E8 \u05D4\u05DB\u05D9 \u05E0\u05D5\u05E2\u05D6-\u05E8\u05D5\u05DE\u05E0\u05D8\u05D9 \u05E9\u05D4\u05D9\u05D9\u05EA \u05E9\u05DE\u05D7/\u05D4 \u05DC\u05E0\u05E1\u05D5\u05EA \u05D0\u05D9\u05EA\u05D9?","\u05DE\u05D4 \u05E7\u05D5\u05E8\u05D4 \u05DC\u05DA \u05D1\u05D2\u05D5\u05E3 \u05DB\u05E9\u05D0\u05E0\u05D9 \u05DE\u05EA\u05E7\u05E8\u05D1/\u05EA \u05D0\u05DC\u05D9\u05DA \u05DC\u05D0\u05D8?","\u05D0\u05D9\u05D6\u05D4 \u05E1\u05D5\u05D2 \u05E0\u05E9\u05D9\u05E7\u05D4 \u05D4\u05DB\u05D9 \u05DE\u05D3\u05DC\u05D9\u05E7 \u05D0\u05D5\u05EA\u05DA?","\u05DE\u05D4 \u05D4\u05D9\u05D9\u05EA \u05E8\u05D5\u05E6\u05D4 \u05E9\u05D0\u05D2\u05D9\u05D3 \u05DC\u05DA \u05DB\u05E9\u05D0\u05E0\u05D7\u05E0\u05D5 \u05DC\u05D1\u05D3, \u05D5\u05E9\u05D0\u05E0\u05D9 \u05DC\u05D0 \u05D0\u05D5\u05DE\u05E8/\u05EA \u05DE\u05E1\u05E4\u05D9\u05E7?","\u05D0\u05D9\u05D6\u05D4 \u05E1\u05D5\u05D2 \u05D7\u05D9\u05D1\u05D5\u05E7 \u05D4\u05DB\u05D9 \u05E0\u05E2\u05D9\u05DD \u05DC\u05DA?","\u05E2\u05DC \u05DE\u05D4 \u05D4\u05D9\u05D9\u05EA \u05E8\u05D5\u05E6\u05D4 \u05E9\u05E0\u05E7\u05D3\u05D9\u05E9 \u05E2\u05D5\u05D3 \u05D6\u05DE\u05DF \u05D1\u05D0\u05D9\u05E0\u05D8\u05D9\u05DE\u05D9\u05D5\u05EA \u05E9\u05DC\u05E0\u05D5?","\u05DE\u05D4 \u05D4\u05D5\u05E4\u05DA \u05D1\u05E2\u05D9\u05E0\u05D9\u05D9\u05DA \u05E8\u05D2\u05E2 \u05E8\u05D2\u05D9\u05DC \u05DC\u05E8\u05D2\u05E2 \u05E8\u05D5\u05DE\u05E0\u05D8\u05D9?","\u05D0\u05D9\u05DA \u05D0\u05E4\u05E9\u05E8 \u05DC\u05D2\u05E8\u05D5\u05DD \u05DC\u05DA \u05DC\u05D4\u05E8\u05D2\u05D9\u05E9 \u05DE\u05E4\u05D5\u05E0\u05E7/\u05EA \u05D4\u05E2\u05E8\u05D1?","\u05D0\u05D9\u05D6\u05D4 \u05D7\u05DC\u05E7 \u05D1\u05E9\u05D1\u05D5\u05E2 \u05D4\u05DB\u05D9 \u05DE\u05EA\u05D0\u05D9\u05DD \u05DC\u05DA \u05DC\u05E8\u05D2\u05E2 \u05D0\u05D9\u05E0\u05D8\u05D9\u05DE\u05D9, \u05D5\u05DC\u05DE\u05D4?","\u05DE\u05D4 \u05D4\u05D9\u05D9\u05EA \u05E8\u05D5\u05E6\u05D4 \u05DC\u05E9\u05DE\u05D5\u05E2 \u05DE\u05DE\u05E0\u05D9 \u05DC\u05E4\u05E0\u05D9 \u05E9\u05E0\u05DB\u05E0\u05E1\u05D9\u05DD \u05DC\u05DE\u05D9\u05D8\u05D4?","\u05DE\u05D4 \u05D4\u05DB\u05D9 \u05DE\u05D7\u05D1\u05E8 \u05D0\u05D5\u05EA\u05DA \u05D0\u05DC\u05D9\u05D9 \u2013 \u05D2\u05D5\u05E3, \u05DE\u05D9\u05DC\u05D9\u05DD \u05D0\u05D5 \u05DE\u05D1\u05D8?"],d:["\u05E0\u05E9\u05E7/\u05D9 \u05DC\u05D9 \u05D0\u05EA \u05D4\u05E9\u05E4\u05EA\u05D9\u05D9\u05DD \u05D1\u05E2\u05D3\u05D9\u05E0\u05D5\u05EA \u05E8\u05DB\u05D4 \u05D1\u05DE\u05E9\u05DA 10 \u05E9\u05E0\u05D9\u05D5\u05EA.","\u05DC\u05D7\u05E9/\u05D9 \u05DC\u05D9 \u05D1\u05D0\u05D5\u05D6\u05DF \u05E9\u05DC\u05D5\u05E9 \u05DE\u05D9\u05DC\u05D9\u05DD \u05E9\u05D0\u05EA/\u05D4 \u05D4\u05DB\u05D9 \u05D0\u05D5\u05D4\u05D1/\u05EA \u05D1\u05D9.","\u05EA\u05DF/\u05D9 \u05DC\u05D9 \u05D7\u05D9\u05D1\u05D5\u05E7 \u05D0\u05D9\u05D8\u05D9 \u05D5\u05E2\u05DE\u05D5\u05E7 \u05E9\u05DC 20 \u05E9\u05E0\u05D9\u05D5\u05EA, \u05D1\u05DC\u05D9 \u05DC\u05D3\u05D1\u05E8.","\u05D4\u05E1\u05EA\u05DB\u05DC/\u05D9 \u05DC\u05D9 \u05D1\u05E2\u05D9\u05E0\u05D9\u05D9\u05DD 30 \u05E9\u05E0\u05D9\u05D5\u05EA \u05D1\u05E9\u05E7\u05D8, \u05D1\u05DC\u05D9 \u05DC\u05E6\u05D7\u05D5\u05E7.","\u05E0\u05E9\u05E7/\u05D9 \u05DC\u05D9 \u05D0\u05EA \u05DB\u05E3 \u05D4\u05D9\u05D3, \u05D5\u05D0\u05D7\u05E8 \u05DB\u05DA \u05D0\u05EA \u05D4\u05DC\u05D7\u05D9, \u05DC\u05D0\u05D8.","\u05E2\u05E9\u05D4/\u05D9 \u05DC\u05D9 \u05E2\u05D9\u05E1\u05D5\u05D9 \u05DB\u05EA\u05E4\u05D9\u05D9\u05DD \u05E8\u05DA \u05D1\u05DE\u05E9\u05DA \u05D3\u05E7\u05D4.","\u05E1\u05E4\u05E8/\u05D9 \u05DC\u05D9 \u05DE\u05D4 \u05D0\u05D4\u05D1\u05EA \u05D1\u05D9 \u05D4\u05D9\u05D5\u05DD, \u05D5\u05D0\u05D7\u05E8 \u05DB\u05DC \u05DE\u05E9\u05E4\u05D8 \u05EA\u05DF/\u05D9 \u05DC\u05D9 \u05E0\u05E9\u05D9\u05E7\u05D4 \u05E7\u05D8\u05E0\u05D4.","\u05E8\u05E7\u05D5\u05D3/\u05D9 \u05D0\u05D9\u05EA\u05D9 \u05E8\u05D9\u05E7\u05D5\u05D3 \u05D0\u05D9\u05D8\u05D9 \u05DC\u05D0\u05D5\u05E8\u05DA \u05E9\u05D9\u05E8 \u05D0\u05D7\u05D3.","\u05DC\u05D9\u05D8\u05D5\u05E3 \u05E2\u05D3\u05D9\u05DF \u05E2\u05DC \u05D4\u05E4\u05E0\u05D9\u05DD \u05E9\u05DC\u05D9 \u05D1\u05DE\u05E9\u05DA 15 \u05E9\u05E0\u05D9\u05D5\u05EA, \u05D1\u05E2\u05D9\u05E0\u05D9\u05D9\u05DD \u05E2\u05E6\u05D5\u05DE\u05D5\u05EA.","\u05D0\u05DE\u05D5\u05E8/\u05D9 \u05DC\u05D9 \u05DE\u05E9\u05E4\u05D8 \u05E9\u05DE\u05E2\u05DC\u05D4 \u05DC\u05DA \u05D7\u05D9\u05D5\u05DA \u2013 \u05D5\u05D0\u05D6 \u05E0\u05E9\u05E7/\u05D9 \u05DC\u05D9 \u05E2\u05DC \u05D4\u05DE\u05E6\u05D7.","\u05D4\u05D7\u05D6\u05E7/\u05D9 \u05D0\u05EA \u05D4\u05D9\u05D3 \u05E9\u05DC\u05D9 \u05D5\u05E0\u05E9\u05E7/\u05D9 \u05DC\u05D9 \u05E2\u05DC \u05DB\u05DC \u05D0\u05E6\u05D1\u05E2.","\u05EA\u05D0\u05E8/\u05D9 \u05DC\u05D9 \u05D1\u05DE\u05D9\u05DC\u05D9\u05DD \u05E8\u05DB\u05D5\u05EA \u05D0\u05EA \u05D4\u05E8\u05D2\u05E2 \u05E9\u05D1\u05D5 \u05D4\u05EA\u05D0\u05D4\u05D1\u05EA \u05D1\u05D9.","\u05D4\u05E0\u05D9\u05D7/\u05D9 \u05D0\u05EA \u05D4\u05E8\u05D0\u05E9 \u05E2\u05DC \u05D4\u05D7\u05D6\u05D4 \u05E9\u05DC\u05D9 \u05D5\u05D4\u05E7\u05E9\u05D1/\u05D9 \u05DC\u05D3\u05D5\u05E4\u05E7 \u05E9\u05DC\u05D9 20 \u05E9\u05E0\u05D9\u05D5\u05EA.","\u05E0\u05E9\u05E7/\u05D9 \u05DC\u05D9 \u05DC\u05D9\u05D3 \u05D4\u05D0\u05D5\u05D6\u05DF \u05D1\u05E2\u05D3\u05D9\u05E0\u05D5\u05EA \u05D5\u05D0\u05DE\u05D5\u05E8/\u05D9 \u201C\u05D0\u05E0\u05D9 \u05DB\u05D0\u05DF \u05D1\u05E9\u05D1\u05D9\u05DC\u05DA\u201D.","\u05E2\u05E9\u05D4/\u05D9 \u05DC\u05D9 \u05E2\u05D9\u05E1\u05D5\u05D9 \u05E2\u05D3\u05D9\u05DF \u05D1\u05DB\u05E4\u05D5\u05EA \u05D4\u05D9\u05D3\u05D9\u05D9\u05DD \u2013 \u05D3\u05E7\u05D4 \u05DC\u05DB\u05DC \u05D9\u05D3.","\u05E9\u05DC\u05D7/\u05D9 \u05DC\u05D9 \u05E0\u05E9\u05D9\u05E7\u05D4 \u05D1\u05D0\u05D5\u05D5\u05D9\u05E8, \u05D5\u05D0\u05D7\u05E8\u05D9 5 \u05E9\u05E0\u05D9\u05D5\u05EA \u05E9\u05DC \u05DE\u05D1\u05D8 \u05EA\u05DF/\u05D9 \u05DC\u05D9 \u05D0\u05D7\u05EA \u05D0\u05DE\u05D9\u05EA\u05D9\u05EA.","\u05E2\u05DE\u05D5\u05D3/\u05D9 \u05DE\u05D5\u05DC\u05D9 \u05D5\u05D4\u05E0\u05D9\u05D7/\u05D9 \u05DC\u05D9 \u05DC\u05D7\u05D1\u05E7 \u05D0\u05D5\u05EA\u05DA \u05DE\u05D0\u05D7\u05D5\u05E8 20 \u05E9\u05E0\u05D9\u05D5\u05EA.","\u05DC\u05D7\u05E9/\u05D9 \u05DC\u05D9 \u05D1\u05D0\u05D5\u05D6\u05DF \u05D0\u05D9\u05DA \u05D0\u05EA\u05D4/\u05D0\u05EA \u05DE\u05EA\u05DB\u05D5\u05D5\u05DF/\u05EA \u05DC\u05D4\u05E4\u05EA\u05D9\u05E2 \u05D0\u05D5\u05EA\u05D9 \u05D4\u05E9\u05D1\u05D5\u05E2.","\u05D4\u05E2\u05D1\u05E8/\u05D9 \u05D0\u05E6\u05D1\u05E2 \u05D1\u05E2\u05D3\u05D9\u05E0\u05D5\u05EA \u05DC\u05D0\u05D5\u05E8\u05DA \u05D4\u05D6\u05E8\u05D5\u05E2 \u05E9\u05DC\u05D9, \u05DE\u05D4\u05DB\u05EA\u05E3 \u05D5\u05E2\u05D3 \u05DB\u05E3 \u05D4\u05D9\u05D3.","\u05D0\u05DE\u05D5\u05E8/\u05D9 \u05DC\u05D9 \u05E9\u05DC\u05D5\u05E9 \u05DE\u05D7\u05DE\u05D0\u05D5\u05EA \u05E2\u05DC \u05D4\u05DE\u05E8\u05D0\u05D4 \u05E9\u05DC\u05D9 \u2013 \u05D1\u05DC\u05D9 \u05DC\u05D4\u05E1\u05E1.","\u05E9\u05D1/\u05D9 \u05DE\u05D5\u05DC\u05D9, \u05D1\u05E8\u05DB\u05D9\u05D9\u05DD \u05E0\u05D5\u05D2\u05E2\u05D5\u05EA, \u05D5\u05D4\u05D7\u05D6\u05E7/\u05D9 \u05DC\u05D9 \u05D0\u05EA \u05D4\u05D9\u05D3\u05D9\u05D9\u05DD \u05D3\u05E7\u05D4 \u05D1\u05E9\u05E7\u05D8.","\u05E0\u05E9\u05E7/\u05D9 \u05DC\u05D9 \u05D0\u05EA \u05D4\u05DC\u05D7\u05D9 \u05D5\u05D0\u05D6 \u05D0\u05EA \u05E4\u05D9\u05E0\u05EA \u05D4\u05E9\u05E4\u05EA\u05D9\u05D9\u05DD, \u05DC\u05D0\u05D8.","\u05D4\u05E2\u05D1\u05E8/\u05D9 \u05D0\u05EA \u05D4\u05D9\u05D3 \u05D1\u05E9\u05D9\u05E2\u05E8 \u05E9\u05DC\u05D9 \u05D1\u05E2\u05D3\u05D9\u05E0\u05D5\u05EA \u05D1\u05DE\u05E9\u05DA 15 \u05E9\u05E0\u05D9\u05D5\u05EA.","\u05D0\u05DE\u05D5\u05E8/\u05D9 \u05DC\u05D9 \u05D1\u05E7\u05D5\u05DC \u05D7\u05DD \u05D5\u05E8\u05DA \u05D0\u05EA \u05D4\u05DE\u05E9\u05E4\u05D8 \u05E9\u05D4\u05DB\u05D9 \u05DE\u05D7\u05DE\u05DD \u05D0\u05D5\u05EA\u05DA \u05DC\u05D4\u05D2\u05D9\u05D3 \u05DC\u05D9.","\u05EA\u05DF/\u05D9 \u05DC\u05D9 \u05E0\u05E9\u05D9\u05E7\u05D4 \u05D0\u05D7\u05EA \u05D0\u05E8\u05D5\u05DB\u05D4 \u05D5\u05E8\u05DB\u05D4 \u2013 \u05D0\u05EA\u05D4/\u05D0\u05EA \u05E7\u05D5\u05D1\u05E2/\u05EA \u05DB\u05DE\u05D4 \u05D6\u05DE\u05DF.","\u05D7\u05D1\u05E7/\u05D9 \u05D0\u05D5\u05EA\u05D9 \u05E2\u05D3 \u05E9\u05E9\u05E0\u05D9\u05E0\u05D5 \u05E0\u05D5\u05E9\u05DE\u05D9\u05DD \u05D1\u05D0\u05D5\u05EA\u05D5 \u05E7\u05E6\u05D1.","\u05E1\u05E4\u05E8/\u05D9 \u05DC\u05D9 \u05E2\u05DC \u05E8\u05D2\u05E2 \u05D1\u05D9\u05E0\u05D9\u05E0\u05D5 \u05E9\u05E2\u05D3\u05D9\u05D9\u05DF \u05DE\u05E2\u05D1\u05D9\u05E8 \u05D1\u05DA \u05D7\u05D5\u05DD, \u05D5\u05D0\u05D6 \u05E0\u05E9\u05E7/\u05D9 \u05DC\u05D9.","\u05E2\u05E9\u05D4/\u05D9 \u05DC\u05D9 \u05E2\u05D9\u05E1\u05D5\u05D9 \u05E7\u05D8\u05DF \u05D1\u05E2\u05D5\u05E8\u05E3 \u05D1\u05DE\u05E9\u05DA 30 \u05E9\u05E0\u05D9\u05D5\u05EA.","\u05E2\u05E6\u05D5\u05DD/\u05D9 \u05E2\u05D9\u05E0\u05D9\u05D9\u05DD, \u05D5\u05D0\u05E0\u05D9 \u05D0\u05E0\u05E9\u05E7 \u05D0\u05D5\u05EA\u05DA \u05D1\u05DE\u05E7\u05D5\u05DD \u05D0\u05D7\u05D3 \u05D1\u05E4\u05E0\u05D9\u05DD \u2013 \u05E0\u05D7\u05E9/\u05D9 \u05D0\u05D9\u05E4\u05D4.","\u05D4\u05D5\u05D1\u05D9\u05DC/\u05D9 \u05D0\u05EA \u05D4\u05D9\u05D3 \u05E9\u05DC\u05D9 \u05DC\u05DE\u05D2\u05E2 \u05E9\u05E0\u05E2\u05D9\u05DD \u05DC\u05DA \u2013 \u05DB\u05EA\u05E3, \u05D2\u05D1 \u05D0\u05D5 \u05E4\u05E0\u05D9\u05DD \u2013 \u05D5\u05D0\u05E0\u05D9 \u05D0\u05E9\u05D0\u05E8 \u05E9\u05DD 20 \u05E9\u05E0\u05D9\u05D5\u05EA.","\u05E0\u05E9\u05E7/\u05D9 \u05DC\u05D9 \u05D0\u05EA \u05D4\u05E6\u05D5\u05D5\u05D0\u05E8 \u05D1\u05E2\u05D3\u05D9\u05E0\u05D5\u05EA \u05D1\u05DE\u05E9\u05DA 10 \u05E9\u05E0\u05D9\u05D5\u05EA.","\u05EA\u05D0\u05E8/\u05D9 \u05DC\u05D9 \u05D1\u05DC\u05D7\u05E9 \u05E2\u05E8\u05D1 \u05E8\u05D5\u05DE\u05E0\u05D8\u05D9 \u05E9\u05D4\u05D9\u05D9\u05EA \u05E8\u05D5\u05E6\u05D4 \u05E9\u05E0\u05D7\u05D5\u05D5\u05D4 \u05D4\u05E9\u05D1\u05D5\u05E2.","\u05D3\u05DE\u05D9\u05D9\u05DF/\u05D9 \u05E9\u05D6\u05D4 \u05D4\u05D3\u05D9\u05D9\u05D8 \u05D4\u05E8\u05D0\u05E9\u05D5\u05DF \u05E9\u05DC\u05E0\u05D5: \u05D4\u05E6\u05D2/\u05D9 \u05D0\u05EA \u05E2\u05E6\u05DE\u05DA \u05DE\u05D7\u05D3\u05E9, \u05D5\u05E0\u05E9\u05E7/\u05D9 \u05DC\u05D9 \u05D0\u05EA \u05D4\u05D9\u05D3.","\u05E9\u05D1/\u05D9 \u05DC\u05D9\u05D3\u05D9, \u05D4\u05E0\u05D7/\u05D9 \u05DC\u05D9 \u05DC\u05D4\u05E0\u05D9\u05D7 \u05D0\u05EA \u05D4\u05E8\u05D0\u05E9 \u05D1\u05D7\u05D9\u05E7\u05DA, \u05D5\u05E1\u05E4\u05E8/\u05D9 \u05DC\u05D9 \u05E2\u05DC \u05D7\u05DC\u05D5\u05DD \u05D9\u05E4\u05D4.","\u05E2\u05E9\u05D4/\u05D9 \u05DC\u05D9 \u05E2\u05D9\u05E1\u05D5\u05D9 \u05E7\u05DC \u05D1\u05D2\u05D1 \u05D4\u05E2\u05DC\u05D9\u05D5\u05DF \u05D1\u05DE\u05E9\u05DA 40 \u05E9\u05E0\u05D9\u05D5\u05EA.","\u05EA\u05DF/\u05D9 \u05DC\u05D9 \u05E0\u05E9\u05D9\u05E7\u05D4 \u05E2\u05DC \u05D4\u05DE\u05E6\u05D7, \u05D0\u05D7\u05EA \u05E2\u05DC \u05D4\u05D0\u05E3 \u05D5\u05D0\u05D7\u05EA \u05E2\u05DC \u05D4\u05E9\u05E4\u05EA\u05D9\u05D9\u05DD.","\u05D0\u05DE\u05D5\u05E8/\u05D9 \u05DC\u05D9 \u05E9\u05DC\u05D5\u05E9\u05D4 \u05D3\u05D1\u05E8\u05D9\u05DD \u05E9\u05D0\u05EA\u05D4/\u05D0\u05EA \u05E8\u05D5\u05E6\u05D4 \u05E9\u05E0\u05E2\u05E9\u05D4 \u05D9\u05D7\u05D3 \u05D4\u05E9\u05E0\u05D4, \u05D5\u05E0\u05E9\u05E7/\u05D9 \u05DC\u05D9 \u05D0\u05D7\u05E8\u05D9 \u05DB\u05DC \u05D0\u05D7\u05D3.","\u05D4\u05D7\u05D6\u05E7/\u05D9 \u05D0\u05D5\u05EA\u05D9 \u05E7\u05E8\u05D5\u05D1 \u05D5\u05D0\u05DE\u05D5\u05E8/\u05D9 \u05DC\u05D9 \u05D1\u05DC\u05D7\u05E9 \u05E9\u05D0\u05EA\u05D4/\u05D0\u05EA \u05D0\u05D5\u05D4\u05D1/\u05EA \u05D0\u05D5\u05EA\u05D9.","\u05E9\u05D9\u05E8 \u05D0\u05D7\u05D3, \u05D7\u05D9\u05D1\u05D5\u05E7 \u05D0\u05D7\u05D3: \u05D4\u05EA\u05E0\u05D3\u05E0\u05D3\u05D5 \u05D9\u05D7\u05D3 \u05E2\u05D3 \u05E9\u05D4\u05E9\u05D9\u05E8 \u05E0\u05D2\u05DE\u05E8.","

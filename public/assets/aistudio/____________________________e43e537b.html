<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>שפת הקשר – משחק זוגי</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf3ec;--card:#fffdfa;--ink:#3b2230;--mut:#7d6672;--rose:#c9566b;--rose2:#e58a8f;--gold:#d49a3a;--sage:#5f9a7f;--line:#ecd9cc;--soft:#f8e4e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#201219;--card:#2c1a24;--ink:#f6e8e2;--mut:#bfa3ad;--rose:#ee8397;--rose2:#c9566b;--gold:#e8b65c;--sage:#7fc3a3;--line:#4a2e3b;--soft:#3b2230;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#201219;--card:#2c1a24;--ink:#f6e8e2;--mut:#bfa3ad;--rose:#ee8397;--rose2:#c9566b;--gold:#e8b65c;--sage:#7fc3a3;--line:#4a2e3b;--soft:#3b2230;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.65;font-size:17px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
#app{max-width:760px;margin:0 auto;padding:16px 16px 60px}
h1,h2,h3{line-height:1.25;margin:0}
button{font:inherit;cursor:pointer;border:0}
.btn{background:linear-gradient(135deg,var(--rose),var(--rose2));color:#fff;padding:13px 26px;border-radius:999px;font-weight:700;box-shadow:0 6px 18px rgba(201,86,107,.28);transition:transform .15s}
.btn:hover{transform:translateY(-2px)}.btn.big{font-size:20px;padding:16px 36px}
.btn.ghost{background:transparent;color:var(--rose);box-shadow:none;border:2px solid var(--rose)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 4px 16px rgba(120,60,70,.06)}
.quote{background:linear-gradient(135deg,var(--soft),var(--card));font-size:19px;font-weight:500;text-align:center;border-color:var(--rose2)}
.hero{text-align:center;padding:50px 8px 20px;position:relative;overflow:hidden}
.eyebrow{color:var(--gold);font-weight:700;letter-spacing:.5px}
.hero h1{font-size:clamp(46px,13vw,84px);font-weight:800;background:linear-gradient(135deg,var(--rose),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;margin:6px 0}
.sig{font-size:25px;font-weight:700;margin:6px 0}
.sub{color:var(--mut);max-width:460px;margin:0 auto 26px}
.names{display:flex;gap:10px;align-items:center;justify-content:center;margin-bottom:26px;flex-wrap:wrap}
.names input{width:150px}
input,textarea{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 14px;width:100%}
input:focus,textarea:focus{outline:none;border-color:var(--rose)}
.fl{position:absolute;inset:0;pointer-events:none}
.fl span{position:absolute;bottom:-30px;font-size:22px;opacity:0;animation:up 9s linear infinite}
@keyframes up{0%{transform:translateY(0);opacity:0}15%{opacity:.5}100%{transform:translateY(-520px) rotate(25deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.fl{display:none}.btn{transition:none}}
.top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.bar{flex:1;height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--gold));border-radius:99px;transition:width .5s}
.pct{font-weight:700;color:var(--rose);min-width:42px}
.back{background:var(--soft);color:var(--rose);border-radius:99px;padding:6px 14px;font-weight:600}
.map{position:relative;margin:20px 0}
.st{display:flex;gap:14px;align-items:center;width:100%;text-align:start;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px;margin:0 0 26px;position:relative;color:var(--ink)}
.st:not(:last-child)::after{content:"";position:absolute;bottom:-26px;inset-inline-start:42px;width:3px;height:26px;background:repeating-linear-gradient(var(--rose2) 0 5px,transparent 5px 10px)}
.st:nth-child(even){margin-inline-start:28px}.st:nth-child(odd){margin-inline-end:28px}
.st.open{border-color:var(--rose);box-shadow:0 6px 20px rgba(201,86,107,.2)}
.st.lock{opacity:.55;cursor:not-allowed}.st.fin{border-color:var(--sage)}
.ic{flex:none;width:58px;height:58px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:28px}
.st h3{font-size:19px}.st small{color:var(--mut);display:block}
.pips{display:flex;gap:6px;margin-top:4px}.pips b{width:20px;height:6px;border-radius:9px;background:var(--line)}.pips b.on{background:var(--sage)}
.tabs{display:flex;gap:8px;margin:14px 0;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0;z-index:5}
.tabs button{flex:1;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 4px;font-weight:600;color:var(--mut);font-size:15px}
.tabs button.on{border-color:var(--rose);color:var(--rose);background:var(--soft)}
.grid{display:grid;gap:14px}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
.lc{border-top:6px solid var(--c);margin:0}.lc h3{font-size:19px}.lc .tag{color:var(--c);font-weight:700;margin:2px 0 8px}
.lc ul{margin:0;padding-inline-start:20px;color:var(--ink)}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.flow span{background:var(--soft);border:2px solid var(--rose2);border-radius:99px;padding:6px 16px;font-weight:700}
.flow em{color:var(--rose);font-style:normal;font-weight:800}
.h2{font-size:22px;margin:22px 0 8px}
.opt{display:block;width:100%;text-align:start;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:13px 16px;margin:9px 0;color:var(--ink)}
.opt:hover{border-color:var(--rose)}.opt.ok{border-color:var(--sage);background:rgba(95,154,127,.15)}.opt.no{border-color:#c0504d;opacity:.7}
.seg{padding:1px 6px;border-radius:8px;background:var(--soft)}.ph{color:var(--mut)}
.lab{font-weight:700;color:var(--c);margin-top:12px;display:block}
.pv{font-size:19px;line-height:2;border-inline-start:5px solid var(--rose);padding-inline-start:14px}
.cv{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:8px 0}
.cv .a{text-decoration:line-through;color:#b65a58;background:rgba(192,80,77,.1)}.cv .b{background:rgba(95,154,127,.18);font-weight:600}.cv div{padding:9px 12px;border-radius:12px}
.big{font-size:28px}
.role{display:inline-block;background:var(--rose);color:#fff;border-radius:99px;padding:3px 16px;font-weight:700}
.role.l{background:var(--sage)}.role.b{background:var(--gold)}
.line{background:var(--soft);border-radius:14px;padding:12px 16px;margin:8px 0;font-weight:500;font-size:19px}
.timer{text-align:center;margin:16px 0}
.time{font-size:62px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--rose);direction:ltr}
.rules li{margin:5px 0}
.dots{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}.dots b{width:9px;height:9px;border-radius:50%;background:var(--line)}.dots b.on{background:var(--rose)}
.row{display:flex;gap:10px;justify-content:space-between;margin-top:16px}
.cen{text-align:center}.mut{color:var(--mut)}
.pick{display:flex;gap:8px;margin:10px 0}.pick button{flex:1;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px;font-weight:600;color:var(--ink)}.pick button.on{border-color:var(--rose);background:var(--soft)}
details summary{cursor:pointer;font-weight:700;color:var(--rose)}
.tick{color:var(--sage)}

.lang{display:inline-flex;border:2px solid var(--line);border-radius:99px;overflow:hidden;margin-bottom:6px}.lang button{background:var(--card);color:var(--mut);padding:5px 14px;font-weight:600;font-size:14px}.lang button.on{background:var(--rose);color:#fff}
.ov{position:fixed;inset:0;background:rgba(30,10,20,.6);display:grid;place-items:center;z-index:50;padding:16px}.md{background:var(--card);border-radius:24px;max-width:420px;width:100%;padding:24px;text-align:center;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.price{font-size:52px;font-weight:800;color:var(--rose);line-height:1.2}
.st.pay{border-color:var(--gold);cursor:pointer}.st.pre{border-style:dashed}
body.wine{--bg:#2b0b16;--card:#3a1220;--ink:#f7e7d0;--mut:#d3b79a;--rose:#e0b45a;--rose2:#b8324f;--gold:#e0b45a;--sage:#c47a5a;--line:#5a2233;--soft:#4a1829;color-scheme:dark}
body.wine .btn{color:#2b0b16}body.wine .btn.ghost{background:transparent;color:var(--gold);border-color:var(--gold)}body.wine .role,body.wine .lang button.on{color:#2b0b16}
.st.next{border-color:var(--rose);box-shadow:0 0 0 4px rgba(201,86,107,.25),0 8px 26px rgba(201,86,107,.35);animation:glow 1.8s ease-in-out infinite}
.st .nx{color:var(--rose);font-weight:800}
@keyframes glow{50%{box-shadow:0 0 0 10px rgba(201,86,107,.1),0 8px 26px rgba(201,86,107,.35)}}
@media (prefers-reduced-motion:reduce){.st.next{animation:none}}
body{transition:background .5s}
body.ask{--bg:#fde1e5}body.ans{--bg:#dcf0e8}
@media (prefers-color-scheme:dark){body.ask{--bg:#431c2a}body.ans{--bg:#17332b}}
.splash{min-height:82vh;display:grid;place-content:center;justify-items:center;text-align:center;gap:4px;cursor:pointer}
.logo .draw{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.8s ease forwards}
.logo .d2{animation-delay:.5s}
.logo .ht{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .6s 1.5s ease forwards,beat 1.6s 2.1s ease-in-out infinite}
@keyframes dr{to{stroke-dashoffset:0}}@keyframes pop{to{opacity:1}}@keyframes beat{50%{transform:scale(1.15)}}
.sp-t{font-size:clamp(34px,10vw,58px);font-weight:800;background:linear-gradient(135deg,var(--rose),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;margin:6px 0 0;opacity:0;animation:pop .9s 1s forwards}
.sp-s{color:var(--mut);margin:0;opacity:0;animation:pop .9s 1.5s forwards}
@media (prefers-reduced-motion:reduce){.logo .draw{animation:none;stroke-dashoffset:0}.logo .ht,.sp-t,.sp-s{animation:none;opacity:1}}
.err{color:#c0504d;font-weight:600;margin:8px 0}
.chip{display:inline-block;background:var(--soft);border-radius:99px;padding:4px 14px;font-weight:700}.chip.ok{background:rgba(95,154,127,.2);color:var(--sage)}
.lk{background:var(--soft);border-radius:12px;padding:10px;word-break:break-all;font-size:14px;margin:8px 0;user-select:all;direction:ltr;text-align:left}
a.btn{display:inline-block;text-decoration:none}
.fab{position:fixed;inset-inline-end:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;background:linear-gradient(135deg,var(--rose),var(--rose2));color:#fff;border-radius:99px;padding:12px 20px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.fab .bd{background:#fff;color:#c9566b;border-radius:99px;padding:0 8px;margin-inline-start:8px}
.cp{position:fixed;inset-inline-end:0;bottom:0;z-index:45;width:min(100%,420px);height:min(78vh,620px);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:22px 22px 0 0;display:flex;flex-direction:column;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.3)}
.ch{display:flex;justify-content:space-between;align-items:center}
.cm{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:10px 2px}
.mg{max-width:82%;padding:8px 12px;border-radius:16px;background:var(--soft);word-break:break-word}
.mg.me{background:var(--rose);color:#fff}.mg small{display:block;opacity:.75;font-size:11px}
html[dir=rtl] .mg.me,html[dir=ltr] .mg.th{align-self:flex-start}html[dir=rtl] .mg.th,html[dir=ltr] .mg.me{align-self:flex-end}
.cin{display:flex;gap:8px}.cn{font-size:12px;color:var(--mut);margin:6px 0 0}
.res{border:2px solid var(--rose2);background:linear-gradient(135deg,var(--soft),var(--card))}.res.on{box-shadow:0 0 0 4px rgba(201,86,107,.2),0 10px 30px rgba(201,86,107,.25)}
.rl{font-weight:800;color:var(--rose);margin-bottom:6px}.rt{font-size:22px;font-weight:600;line-height:1.8;min-height:60px}
.rt .seg{background:transparent;border-bottom:3px solid var(--c);padding:0 2px}
.ra{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.foot{text-align:center;color:var(--mut);font-size:13px;margin:34px 0 80px}
#toast{position:fixed;inset-inline:0;bottom:90px;margin:auto;width:max-content;max-width:90%;background:#3b2230;color:#fff;padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:60}#toast.on{opacity:1}
.rolebar{text-align:center;font-weight:700;margin:10px 0}
</style>
</head>
<body>
<div id="app"></div>
<div id="chat"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const COL=["#c9566b","#d49a3a","#5f9a7f","#8a6bb0"];
const M_HE=[
{t:"לזהות את שפת הקשר",s:"ממעבר מדיבור אוטומטי לשיח מודע",ic:"🔍",
 L:{idea:"אנחנו לא מדברים איך שאנחנו חושבים שאנחנו מדברים – אנחנו מדברים איך שלמדנו לשרוד בקשר.",
 cards:[{h:"🛡️ שפת הישרדות",g:"הקשר קיים – אבל במתח מתמיד",p:["האשמה, ביקורת, הגנה","שתיקה או התפרצות","צורך “לנצח” בשיחה"]},
 {h:"🌫️ שפת הימנעות",g:"הקשר שקט – אבל רחוק",p:["“הכול בסדר” כשלא בסדר","ויתור על עצמי כדי לשמור שקט","פחד מקונפליקט"]},
 {h:"🌱 שפת בנייה",g:"הקשר חי – ונבנה",p:["אחריות על הדיבור","ביטוי רגשי ללא האשמה","יכולת לשהות בקושי יחד"]}],
 note:"מה שנאמר – אינו מה שנשמע. אנחנו שומעים איום, לא מילים. זה לא חוסר רצון להקשיב – זו שפה שלא פוענחה. רוב הזוגות נעים בין הישרדות להימנעות, מבלי לדעת שיש שפה שלישית."},
 tool:"quiz",
 P:[{n:"לשמוע את השפה – בלי להגיב",rules:["אין ויכוח","אין תיקון","אין תגובה רגשית","אין “אבל”","אין פרשנות","זה לא שיח – זה תרגול הקשבה"],
 round:[{t:"הדובר/ת – דיבור מודע",w:"S",x:"עונים בקול, ברצף, בלי לעצור. לא מאשימים – מדברים על עצמנו בלבד.",l:["כשקשה לי בקשר שלנו – אני בדרך כלל מגיב/ה ב________","ברגעי מתח, השפה שיוצאת ממני היא בדרך כלל…","הדבר שהכי קשה לי להגיד בזוגיות הוא…","כשאני לא נשמע/ת – אני נוטה ל…"],s:300},
 {t:"המקשיב/ה – הקשבה שקטה",w:"L",x:"לא מגיבים, לא מתקנים, לא מסבירים, לא מתגוננים. רק שואלים את עצמכם בשקט:",l:["איזו שפת קשר אני שומע/ת כאן? הישרדות / הימנעות / בנייה"],s:0},
 {t:"שיקוף מינימלי",w:"L",x:"משפט אחד בלבד, בדיוק בפורמט הזה. בלי להוסיף כלום – לא “וזה בגלל…” ולא “וגם אני…”",l:["מה ששמעתי הוא שכשקשה לך – השפה שלך נוטה ל________."],s:60}],swap:1,
 closing:[{t:"סגירה משותפת",w:"B",x:"כל אחד משלים בתורו. לא פותחים שיחה מעבר לזה.",l:["הדבר שהכי הפתיע אותי היה…","משהו אחד שלמדתי על שפת הקשר שלנו…"],s:180},
 {t:"משפט המפתח",w:"B",x:"אמרו יחד:",l:["היום לא תיקנו כלום – אבל התחלנו לראות. ומכאן אפשר לבנות."],s:0}]}]},
{t:"דפוסי שיח שמרחיקים",s:"לזהות, לעצור, ולהפסיק לפגוע בלי כוונה",ic:"🌀",
 L:{idea:"בזוגיות אנחנו לא מגיבים למה שנאמר – אלא למה שזה מפעיל בנו.",
 cards:[{h:"1. דפוס ההאשמה",g:"“אתה תמיד / את אף פעם”",p:["הכללה וביקורת","הטלת אחריות על האחר","באמת קורה: צורך להיראות ולהישמע – שמתחפש לביקורת"]},
 {h:"2. דפוס ההגנה",g:"“זה לא נכון / אתה מגזים / זה בגללך”",p:["הצדקה והסברים","ביטול החוויה של האחר","באמת קורה: פחד מאשמה שמונע הקשבה"]},
 {h:"3. דפוס הנסיגה",g:"שתיקה, התרחקות, סגירות",p:["הימנעות משיחה, “אין לי כוח”","קיפאון רגשי","באמת קורה: ניסיון לשמור על עצמי – במחיר הקשר"]},
 {h:"4. דפוס ההסלמה",g:"הרמת קול, ציניות, פיצוץ",p:["תגובות קיצוניות וטונים חדים","אובדן גבולות בדיבור","באמת קורה: כאב שלא קיבל מקום – ויוצא בעוצמה"]}],
 flow:{h:"המעגל הזוגי – דפוס אחד מפעיל דפוס אחר",st:["האשמה","הגנה","הסלמה","נסיגה"],loop:1},
 note:"ברגע שהדפוס מזוהה – הוא מפסיק להיות “אנחנו”. הזוגיות לא דורשת אנשים מושלמים, אלא אנשים שמזהים מה מנהל אותם."},
 tool:"match",
 P:[{n:"לזהות את הדפוס – בלי להאשים",rules:["מדברים על הדפוס שלי – לא של בן/בת הזוג","בלי דוגמאות ובלי סיפורים","לא “אתה מתחיל” – אלא “זה המעגל שלנו”"],
 pre:[{t:"בחירה אישית",w:"B",x:"כל אחד בוחר בשקט דפוס אחד שהוא מזהה בעצמו – לא בבן/בת הזוג: האשמה, הגנה, נסיגה או הסלמה.",l:[],s:60}],
 round:[{t:"שיתוף מוגן",w:"S",x:"אומרים משפט אחד, ממלאים את החסר:",l:["כשאני מרגיש/ה ______, הדפוס שנוטה לצאת ממני הוא ______."],s:60},
 {t:"הקשבה ושיקוף",w:"L",x:"עונים רק מילה אחת – וזה הכול:",l:["שמעתי."],s:0}],swap:1,
 closing:[{t:"זיהוי משותף",w:"B",x:"יחד משלימים:",l:["המעגל שאנחנו מזהים בינינו הוא ______."],s:120}]}]},

function sentence(k){const v=(BV[k]||[]).map(x=>(x||"").trim()),r=v[3]?(/[.!?]$/.test(v[3])?v[3]:v[3]+"."):"";return v.slice(0,3).filter(Boolean).map(cl).join(", ")+(r?". "+r:".")}

 <div class="ra"><button class="btn" id="bcp" onclick="copyText(sentence('${k}'))">📋 ${X("העתקה","Copy")}</button><button class="btn ghost" id="bsn" onclick="sendSentence('${k}')">💬 ${X("שליחה לצ'אט הזוגי","Send to the couple chat")}</button></div></div>
 ${k=="build3"?`<div class="card"><h3>${X("משפטים שמפסיקים להזיק","Sentences that stop causing harm")}</h3><p class="mut">${X("המרה משפת הישרדות לשפת בנייה","Converting survival language into building language")}</p>${CV.map(c=>`<div class="cv"><div class="a">${c[0]}</div><span>${NX()}</span><div class="b">${c[1]}</div></div>`).join("")}</div>`:""}

function bup(k){
 const c=BD[k],v=c.f.map((_,i)=>($("#b"+i)||{value:""}).value.trim());BV[k]=v;const rt=$("#rt");if(!rt)return;
 const ok=v.every(x=>x.length>2),sep=[", ",", ",". ",""];
 rt.innerHTML=v.some(x=>x)?v.map((x,i)=>(x?`<span class="seg" style="--c:${COL[i]}">${esc(i<3?cl(x):x)}</span>`:`<span class="ph">[${c.f[i][0]}]</span>`)+sep[i]).join("")+(v[3]&&!/[.!?]$/.test(v[3])?".":""):`<span class="ph">${X("המשפט המלא יופיע כאן…","Your full sentence will appear here…")}</span>`;
 const r=$("#res");if(r)r.classList.toggle("on",ok);
 ["#bcp","#bsn"].forEach(s=>{const b=$(s);if(b)b.disabled=!ok});const d=$("#bd");if(d)d.disabled=!ok&&!D(S.m,"T")}

/* ================= module 5 tool: 5 + 5 closeness cards ================= */
function deck5(){if(CS.order)return CS.order;let s=0;for(const ch of rid())s=(s*31+ch.charCodeAt(0))>>>0;
 const o=CD.map((_,i)=>i);for(let i=o.length-1;i>0;i--){s=(s*1664525+1013904223)>>>0;const j=s%(i+1);[o[i],o[j]]=[o[j],o[i]]}return CS.order=o}
function cardGo(d){if(CS.pos==0&&d<0){go("mod",4,"L");return}CS.pos=Math.min(10,CS.pos+d);if(CS.pos>=10)mark(4,"T");render()}
function cards(){
 const o=deck5(),p=CS.pos;
 if(p>=10)return `<div class="card cen"><h2 class="big">🎉 ${X("סיימתם! 5 קלפים לכל אחד","You did it! 5 cards each")}</h2><p>${X("כל אחד שאל וענה – כעת עוברים לתרגול הזוגי.","Each of you asked and answered – now on to the couple practice.")}</p></div><div class="row"><button class="btn ghost" onclick="CS.pos=0;render()">${X("להתחיל שוב","Start again")}</button><button class="btn" onclick="go('mod',4,'P')">${X("לתרגול הזוגי","To the couple practice")} ${NX()}</button></div>`;
 const asker=p<5?0:1,ans=1-asker,v=S.mode=="remote"?S.me:0,role=asker===v?"ask":"ans";
 return `${p==5?`<div class="card quote">🔄 ${X(`החליפו תפקידים! עכשיו ${esc(nm(asker))} שואל/ת`,`Switch roles! Now ${esc(nm(asker))} asks`)}</div>`:""}
 <p class="rolebar">${X(`${esc(nm(asker))} שואל/ת · ${esc(nm(ans))} עונה`,`${esc(nm(asker))} asks · ${esc(nm(ans))} answers`)}</p>
 <p class="cen"><span class="role ${role=="ask"?"":"l"}">${esc(nm(v))}: ${role=="ask"?X("השואל/ת","the asker"):X("העונה","the answerer")}</span></p>
 <div class="card quote" style="font-size:23px;min-height:160px;display:grid;place-items:center">${CD[o[p]]}</div>
 <p class="cen mut">${X(`קלף ${p+1} מתוך 10 · תור ${esc(nm(asker))}: ${p%5+1} מתוך 5`,`Card ${p+1} of 10 · ${esc(nm(asker))}’s turn: ${p%5+1} of 5`)}</p>
 <div class="row"><button class="btn ghost" onclick="cardGo(-1)">${BK()} ${X("הקודם","Previous")}</button><button class="btn" onclick="cardGo(1)">${p==9?X("סיימנו","We’re done"):X("הקלף הבא","Next card")} ${NX()}</button></div>
 <p class="cen mut">${X("השואל/ת מקריא/ה, והעונה עונה בכנות. המקשיב/ה אומר/ת רק: “שמעתי אותך” · “זה מובן לי” · “אני כאן איתך”.","The asker reads it aloud, the answerer replies honestly. The listener says only: “I hear you” · “I understand” · “I’m here with you”.")}</p>`}

/* ================= step 6: 100 cards, numbered ================= */
function prem(){
 const nq=PRM.q.length,N=nq+PRM.d.length;
 if(!G.order||G.order.length!=N){G.order=shuf(N);G.pos=0}
 const idx=G.order[G.pos],dare=idx>=nq,txt=dare?PRM.d[idx-nq]:PRM.q[idx],n=G.pos+1,last=n>=N,a=esc(nm(G.pos%2)),b=esc(nm(1-G.pos%2));
 return `<div class="card"><h3>${X("חוקי המשחק","Game rules")}</h3><ul class="rules">${PRM.rules.map((r,i)=>`<li>${["💌","🤍","👂","🌹"][i]} ${r}</li>`).join("")}</ul></div>
 <p class="cen"><span class="role">${dare?X(`${a} שולף/ת ומציע/ה`,`${a} draws & proposes`):X(`${a} שולף/ת ושואל/ת`,`${a} draws & asks`)}</span> <span class="role l">${dare?X(`${b} מבצע/ת`,`${b} takes it on`):X(`${b} עונה`,`${b} answers`)}</span></p>
 <p class="cen mut"><b>${dare?X("💋 הצעה לקרבה / אתגר אינטימי","💋 Closeness suggestion / intimate challenge"):X("💌 שאלה מהלב","💌 Question from the heart")}</b></p>
 <div class="card quote" style="font-size:23px;min-height:170px;display:grid;place-items:center;border-color:var(--gold)">${txt}</div>
 <p class="cen" style="font-size:20px"><b>${X(`${n} מתוך ${N}`,`${n} of ${N}`)}</b></p>
 ${last?`<p class="cen"><b>🏁 ${X(`הגעתם לקלף ${N} – המשחק נעצר.`,`You’ve reached card ${N} – the game stops here.`)}</b></p>`:""}
 <div class="row" style="justify-content:center;flex-wrap:wrap"><button class="btn ghost" onclick="G.order=null;render()">${X("להתחיל שוב","Start again")}</button>${last?"":`<button class="btn" onclick="G.pos++;render()">${X("קלף הבא","Next card")} 🔥</button>`}<button class="btn" onclick="mark(5,'G');go('map')">${X("סיום","Finish")}</button></div>`}

/* ================= payment / reset modals ================= */
function openPay(){S.modal="pay";S.err="";S.payer=S.me;render()}
function buy(){if(PAY_URL){window.open(PAY_URL,"_blank","noopener")}else{S.err="pay";render()}}
function unlockFull(){S.full=1;S.paidBy=nm(S.payer!=null?S.payer:S.me);S.modal=null;S.err="";save();Room.update({paid:{by:S.paidBy,ts:Date.now()}});render();if(S.v=="map")setTimeout(focusNext,80)}
function applyCode(){const v=($("#code")||{value:""}).value.trim();if(v===ACCESS_CODE)unlockFull();else{S.err="code";render()}}
function askReset(){S.modal="reset";render()}
function doFullReset(){
 clearInterval(T.iv);
 try{for(let i=localStorage.length-1;i>=0;i--){const k=localStorage.key(i);if(k&&k.indexOf("shk")==0)localStorage.removeItem(k)}}catch(e){}
 const lang=S.lang;S=fresh();S.lang=lang;S.v="login";
 Q={i:0,sc:[0,0,0]};MT={i:0,sel:null,ok:0};BV={};CS={pos:0,order:null};G={order:null,pos:0};P=null;
 save();setL();render();window.scrollTo(0,0)}
function modal(){
 if(S.modal=="reset")return `<div class="ov"><div class="md" role="dialog" aria-modal="true"><h2>${X("האם לאפס את כל ההתקדמות?","Reset all progress?")}</h2><p class="mut">${X("הכול יימחק לחלוטין: השלבים שהושלמו, שמות בני הזוג, הטלפונים, החיבור הזוגי, הצ'אט והגישה המלאה. תחזרו למסך ההתחברות.","Everything will be erased: completed steps, partner names, phone numbers, the couple connection, the chat and the full access. You’ll return to the login screen.")}</p><div class="row"><button class="btn ghost" onclick="closeM()">${X("ביטול","Cancel")}</button><button class="btn" onclick="doFullReset()">${X("כן, לאפס הכול","Yes, reset everything")}</button></div></div></div>`;
 if(S.modal=="pay")return `<div class="ov"><div class="md" role="dialog" aria-modal="true"><div class="big">💎</div><h2>${X("פותחים את הגרסה המלאה","Unlock the full version")}</h2><div class="price">${X("20 ₪","$6")}</div><p>${X("אחד מכם משלם פעם אחת – והגישה נפתחת לשני בני הזוג: כל 5 המודולים + שלב 6 הפרמיום, מרחב אינטימי.","One of you pays once – and access opens for both partners: all 5 modules + the Premium Step 6, the Intimate Space.")}</p>
 <p class="mut" style="margin-bottom:4px">${X("מי משלם?","Who’s paying?")}</p><div class="pick">${[0,1].map(i=>`<button class="${S.payer==i?"on":""}" onclick="S.payer=${i};render()">${esc(nm(i))}</button>`).join("")}</div>
 <button class="btn big" onclick="buy()">${X("לרכישה ותשלום","Buy now")}</button>${S.err=="pay"?`<p class="mut">${X("קישור הסליקה יתווסף בקרוב.","The checkout link will be added soon.")}</p>`:""}
 <hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><input id="code" placeholder="${X("יש לי קוד גישה","I have an access code")}" autocomplete="off"><p style="margin:10px 0"><button class="btn ghost" onclick="applyCode()">${X("הפעלה","Activate")}</button></p>${S.err=="code"?`<p class="err">${X("הקוד שגוי, נסו שוב.","Incorrect code, please try again.")}</p>`:""}
 <button class="back" onclick="closeM()">${X("אולי אחר כך","Maybe later")}</button></div></div>`;
 return ""}

/* ================= guided couple practice ================= */
function practice(m){
 if(!P){
  if(m.P.length>1)return `<p>${X("בחרו תרגול:","Choose a practice:")}</p>`+m.P.map((p,i)=>`<button class="opt" onclick="pstart(${i})"><b>${p.n}</b></button>`).join("")+`<div class="row"><button class="btn ghost" onclick="go('mod',${S.m},'T')">${BK()} ${X("הקודם","Previous")}</button><span></span></div>`;
  pstart(0,1);
 }
 const p=m.P[P.pi];
 if(P.setup)return `<div class="card"><h3>${p.n}</h3>${p.prep?`<p><b>${X("הכנה:","Preparation:")}</b></p><ul class="rules">${p.prep.map(x=>`<li>${x}</li>`).join("")}</ul>`:""}
  <p><b>${X("כללי הבסיס – לקרוא לפני שמתחילים:","Ground rules – read before you start:")}</b></p><ul class="rules">${p.rules.map(x=>`<li>🛑 ${x}</li>`).join("")}</ul>
  <p><b>${X("מי מדבר ראשון?","Who speaks first?")}</b></p><div class="pick">${[0,1].map(i=>`<button class="${P.first==i?"on":""}" onclick="P.first=${i};render()">${esc(nm(i))}</button>`).join("")}</div>
  <p class="mut">${X("בהמשך מחליפים תפקידים.","You’ll switch roles later.")}</p>
  <label><input type="checkbox" style="width:auto" id="rd" onchange="$('#go').disabled=!this.checked"> ${X("קראנו את הכללים ומסכימים להם","We’ve read the rules and agree to them")}</label></div>
  <div class="row"><button class="btn ghost" onclick="${m.P.length>1?"P=null":`go('mod',${S.m},'T')`};${m.P.length>1?"render()":""}">${BK()} ${X("הקודם","Previous")}</button><button class="btn big" id="go" disabled onclick="P.setup=0;P.i=0;pstep()">${X("מתחילים 💗","Let’s begin 💗")}</button></div>`;
 if(P.end)return `<div class="card cen"><h2 class="big">${X("🥂 כל הכבוד!","🥂 Well done!")}</h2><p>${X("סיימתם את התרגול. עשיתם משהו שרוב הזוגות לא עושים: עצרתם להקשיב.","You finished the practice. You did something most couples don’t: you stopped to listen.")}</p></div><div class="row"><button class="btn ghost" onclick="P.end=0;P.i=${P.fl.length-1};pstep()">${BK()} ${X("הקודם","Previous")}</button><button class="btn" onclick="endP()">${X("חזרה למפה – התחנה הבאה נפתחת","Back to the map – the next station opens")}</button></div>`;
 const st=P.fl[P.i],sp=P.first^(st.f||0),w=st.w;
 const role=w=="S"?`<span class="role">${X("מדבר/ת:","Speaker:")} ${esc(nm(sp))}</span>`:w=="L"?`<span class="role l">${X("מקשיב/ה:","Listener:")} ${esc(nm(1-sp))}</span>`:`<span class="role b">${X("שניכם יחד","Both together")}</span>`;
 return `<div class="dots">${P.fl.map((_,i)=>`<b class="${i<=P.i?"on":""}"></b>`).join("")}</div>
 ${st.r2&&P.fl[P.i-1]&&!P.fl[P.i-1].r2?`<p class="cen"><b>🔄 ${X("החליפו תפקידים!","Switch roles!")}</b></p>`:""}
 <div class="card"><p class="mut">${X("שלב","Step")} ${P.i+1} ${X("מתוך","of")} ${P.fl.length}</p><h2>${st.t}</h2><p>${role}</p>${st.x?`<p>${st.x}</p>`:""}${(st.l||[]).map(l=>`<div class="line">${l}</div>`).join("")}
 ${st.s?`<div class="timer"><div class="time" id="tm"></div><button class="btn" id="tb" onclick="ttog()"></button> <button class="back" onclick="trst()">${X("איפוס","Reset")}</button></div>`:""}</div>
 <div class="row"><button class="btn ghost" onclick="${P.i?"P.i--;pstep()":"clearInterval(T.iv);T.run=0;P.setup=1;render()"}">${BK()} ${X("הקודם","Previous")}</button><button class="btn" onclick="${P.i==P.fl.length-1?"P.end=1;render()":"P.i++;pstep()"}">${P.i==P.fl.length-1?X("סיום","Finish"):X("הבא","Next")+" "+NX()}</button></div>`;
}

/* ================= init ================= */
function init(){
 setL();
 S.invite=urlParam("invite");if(S.invite&&S.room===S.invite)S.invite=null;
 if((urlParam("unlock")||"").toUpperCase()===UNLOCK_PARAM){S.full=1;save()}
 const d=Room.read(rid());if(d)S.chat=d.chat||[];
 Room.listen();render();setTimeout(leaveSplash,3000);
}
init();
</script>
